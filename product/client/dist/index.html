<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090B10" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!--
      THEME FLASH PREVENTION
      This inline script runs synchronously before React hydrates.
      It reads the saved theme from localStorage and applies .dark
      to <html> immediately so there is zero flash between system
      default and user preference on load.
    -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('campusos_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Critical CSS — prevent FOUC */
      html { background-color: #F7F8FC; }
      html.dark { background-color: #090B10; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
    </style>

    <link rel="stylesheet" crossorigin href="/assets/index-Cmgttd4W.css">
