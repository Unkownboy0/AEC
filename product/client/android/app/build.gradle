apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('CAMPUSOS_ANDROID_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('CAMPUSOS_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CAMPUSOS_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CAMPUSOS_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.campusos.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId System.getenv('CAMPUSOS_APP_ID') ?: "com.campusos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        manifestPlaceholders = [
            campusosHost: System.getenv('CAMPUSOS_HOST') ?: "campusos.app"
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    configurations.configureEach {
        resolutionStrategy {
            force "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
            force "androidx.core:core-ktx:${rootProject.ext.androidxCoreVersion}"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestedReleaseBundle = graph.allTasks.any { it.path in [':app:bundleRelease', ':app:assembleRelease'] }
    if (requestedReleaseBundle && !hasReleaseSigning) {
        logger.warn('CAMPUSOS NOTE: Release build running without signing credentials. Generating unsigned release artifact. Set CAMPUSOS_ANDROID_KEYSTORE_FILE, CAMPUSOS_ANDROID_KEYSTORE_PASSWORD, CAMPUSOS_ANDROID_KEY_ALIAS and CAMPUSOS_ANDROID_KEY_PASSWORD for signed store release.')
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Platform & Messaging SDKs
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
