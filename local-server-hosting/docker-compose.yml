version: '3.8'

services:
  # ── PostgreSQL Database Container ──────────────────────────────────────────
  campusos-db:
    image: postgres:16-alpine
    container_name: campusos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos_secure_password
      POSTGRES_DB: campusos
    ports:
      - "5432:5432"
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos -d campusos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── CampusOS Backend API Server ────────────────────────────────────────────
  campusos-api:
    build:
      context: ../product/server
      dockerfile: Dockerfile
    container_name: campusos-api
    restart: unless-stopped
    depends_on:
      campusos-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://campusos:campusos_secure_password@campusos-db:5432/campusos
      JWT_SECRET: campusos_super_secure_production_secret_32chars_minimum
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REMEMBER_ME_REFRESH_TOKEN_EXPIRES_IN: 30d
      ALLOWED_ORIGINS: "*"
      STORAGE_ROOT: /app/uploads
      BACKUP_ROOT: /app/backups
    ports:
      - "5000:5000"
    volumes:
      - campusos_uploads:/app/uploads
      - campusos_backups:/app/backups

  # ── Frontend Web Server & Reverse Proxy ────────────────────────────────────
  campusos-web:
    image: nginx:alpine
    container_name: campusos-web
    restart: unless-stopped
    depends_on:
      - campusos-api
    ports:
      - "80:80"
      - "5173:80"
    volumes:
      - ../product/client/dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  campusos_pgdata:
  campusos_uploads:
  campusos_backups:
